name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.23.x"]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Unit + integration tests
        env:
          SHORTID_REQUIRE_REDIS_TESTS: "1"
        run: go test ./...

      - name: Race tests
        env:
          SHORTID_REQUIRE_REDIS_TESTS: "1"
        run: go test -race ./...

      - name: Benchmark regression guard
        run: ./scripts/bench_guard.sh
